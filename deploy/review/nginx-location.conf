# Add INSIDE the existing HTTPS server {} for edo.iwhalecloud.com.
# This exact location takes precedence over the existing static /verfiles/ path.
location = /verfiles/review/ws {
    proxy_pass http://127.0.0.1:18765/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 12m;
    access_log off;
    error_log /dev/null;
}
